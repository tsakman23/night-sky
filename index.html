<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Night Sky</title>
  <link rel="stylesheet" href="style.css?v=7" />
</head>
<body>
  <canvas id="sky" aria-label="The night sky above your location"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header id="topbar">
    <div class="brand">Night Sky</div>
    <dl class="meta">
      <div class="meta-item"><dt>Time zone</dt><dd id="meta-timezone">—</dd></div>
      <div class="meta-item"><dt>Date &amp; time</dt><dd id="meta-time">—</dd></div>
      <div class="meta-item"><dt>Location</dt><dd id="meta-location">Locating…</dd></div>
      <div class="meta-item"><dt>Sun</dt><dd id="meta-sun">—</dd></div>
    </dl>
    <div class="top-actions">
      <div class="search">
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search constellations &amp; stars" autocomplete="off" spellcheck="false" aria-label="Search constellations and stars" aria-controls="search-results" />
        <kbd class="search-kbd">/</kbd>
        <ul id="search-results" role="listbox" hidden></ul>
      </div>
      <button id="tour-btn" type="button" class="action" title="Planetarium tour of tonight's sky">▶ Tour</button>
      <button id="fullscreen-btn" type="button" class="action icon" title="Full screen (F)" aria-label="Full screen">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="marker" hidden></div>
  <div id="tour-bar" role="toolbar" aria-label="Tour controls" hidden>
    <span class="tb-dot" aria-hidden="true"></span>
    <span class="tb-label">Tour</span>
    <span id="tour-progress" class="tb-progress"></span>
    <button id="tour-pause" type="button" class="tb-btn tb-main"></button>
    <button id="tour-restart" type="button" class="tb-btn" title="Restart the tour" aria-label="Restart the tour">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10a5.5 5.5 0 1 0 1.8-4.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 3.5v3.6h3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="tour-stop" type="button" class="tb-btn" title="Stop the tour (Esc)" aria-label="Stop the tour">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="1.6"/></svg>
    </button>
  </div>
  <div id="tour-cursor" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2.5l15.5 9.2-6.6 1.5 3.7 7.1-2.7 1.4-3.7-7.1L5.4 19z" fill="#fff" stroke="#0b1020" stroke-width="1.3" stroke-linejoin="round"/></svg>
    <span class="ripple"></span>
  </div>

  <div id="tooltip" role="tooltip" hidden></div>

  <aside id="panel" aria-hidden="true">
    <button id="panel-close" type="button" aria-label="Close">×</button>
    <div id="panel-content"></div>
  </aside>

  <footer id="controls">
    <div class="hint">Drag or rest the cursor near an edge to look around · Scroll to zoom · Click a constellation · F full screen</div>
    <div class="time-control">
      <button id="time-now" type="button">Now</button>
      <input id="time-offset" type="range" min="-720" max="720" step="1" value="0" aria-label="Shift time" />
      <span id="time-label">Live</span>
    </div>
    <div class="toggles">
      <label><input id="toggle-lines" type="checkbox" checked /> Lines</label>
      <label><input id="toggle-labels" type="checkbox" /> Names</label>
      <label title="Narrate during the tour"><input id="toggle-voice" type="checkbox" checked /> Voice</label>
      <span id="voice-status" class="voice-status" aria-live="polite"></span>
    </div>
  </footer>

  <script type="module" src="main.js?v=7"></script>
</body>
</html>
